name: PETRO-TWIN AI — CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: Frontend CI (React 19 + TypeScript + Vite)
  # -------------------------------------------------------------
  frontend-ci:
    name: Frontend (React 19 / Vite / TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Audit Dependencies
        run: npm audit --audit-level=high

      - name: Compile TypeScript & Build Production Bundle
        run: npm run build

      - name: Archive Production Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # -------------------------------------------------------------
  # Job 2: ML & Physics Engine CI (Python 3.12 / FastAPI)
  # -------------------------------------------------------------
  ml-physics-ci:
    name: ML & Physics Engine (Python 3.12 / FastAPI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docker/requirements-prod.lock

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip==26.3
          pip install -r docker/requirements-prod.lock
          pip install pip-audit

      - name: Audit Pinned Python Dependencies
        run: pip-audit -r docker/requirements-prod.lock

      - name: Run Unified Physics & ML Test Suite
        run: python scripts/test_all.py

      - name: Verify FastAPI Microservice Boot & Health Check
        run: |
          python -c "
          from ml_service.main import app
          from fastapi.testclient import TestClient
          client = TestClient(app)
          res = client.get('/health')
          assert res.status_code == 200, f'Healthcheck failed: {res.text}'
          print('FastAPI Microservice Healthcheck Verified: 200 OK')
          "

  # -------------------------------------------------------------
  # Job 3: Docker Container Validation
  # -------------------------------------------------------------
  docker-validation:
    name: Docker Container Validation
    runs-on: ubuntu-latest
    needs: [frontend-ci, ml-physics-ci]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate ML Service Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.ml-service
          push: false
          load: false

      - name: Validate Frontend Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: false
          load: false
