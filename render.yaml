services:
  - type: web
    name: petrotwin-ml-service
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r ml_service/requirements.txt
    startCommand: uvicorn ml_service.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
