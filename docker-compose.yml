services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - petrotwin_runtime_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ml-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.ml-service
    environment:
      PYTHONUNBUFFERED: "1"
      HOST: 0.0.0.0
      PETROTWIN_DATA_MODE: ${PETROTWIN_DATA_MODE:-field}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      PETROTWIN_AUTH_MODE: ${PETROTWIN_AUTH_MODE:-disabled}
      PETROTWIN_JWT_SECRET: ${PETROTWIN_JWT_SECRET:-}
      PETROTWIN_TOKEN_TTL_MINUTES: ${PETROTWIN_TOKEN_TTL_MINUTES:-15}
      PETROTWIN_AGENT_BASE_URL: ${PETROTWIN_AGENT_BASE_URL:-}
      PETROTWIN_AGENT_API_KEY: ${PETROTWIN_AGENT_API_KEY:-}
      PETROTWIN_AGENT_MODEL: ${PETROTWIN_AGENT_MODEL:-}
      PETROTWIN_AGENT_TIMEOUT_SECONDS: ${PETROTWIN_AGENT_TIMEOUT_SECONDS:-60}
      PETROTWIN_AGENT_MAX_TOOL_CALLS: ${PETROTWIN_AGENT_MAX_TOOL_CALLS:-8}
      PETROTWIN_FIELD_MODEL_ARTIFACT_DIR: /app/ml_service/saved_models/field
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - petrotwin_model_artifacts:/app/ml_service/saved_models/field
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      ml-service:
        condition: service_healthy
    restart: unless-stopped

volumes:
  petrotwin_runtime_data:
  petrotwin_model_artifacts:
