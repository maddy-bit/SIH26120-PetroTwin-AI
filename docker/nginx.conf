# Loaded from conf.d inside Nginx's http context.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=api_rate:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_rate:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=per_ip_conn:10m;

server {
    listen 3000;
    server_name _;
    server_tokens off;

    client_max_body_size 25m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    keepalive_timeout 65s;
    send_timeout 60s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; connect-src 'self' ws: wss:" always;

    limit_conn per_ip_conn 30;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Login receives a stricter per-client rate limit before the generic API location.
    location = /api/v1/auth/login {
        limit_req zone=login_rate burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://ml-service:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # All non-WebSocket API paths are sent to FastAPI without exposing its port on the host.
    location ~ ^/(api|predict|detect|simulate|agent|optimize|models)(/|$) {
        limit_req zone=api_rate burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://ml-service:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    location /ws/ {
        proxy_pass http://ml-service:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }

    location = /health {
        access_log off;
        proxy_pass http://ml-service:8000/health;
        proxy_set_header Host $host;
    }

    location = /health/live {
        access_log off;
        proxy_pass http://ml-service:8000/health/live;
        proxy_set_header Host $host;
    }

    location = /health/ready {
        access_log off;
        proxy_pass http://ml-service:8000/health/ready;
        proxy_set_header Host $host;
    }

    location ~* \.(?:env|ini|log|sql|bak|conf|ya?ml)$ {
        deny all;
    }
}
